<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- App Store screenshot frame, rendered by storage-cleaner/scripts/frame-screenshots.sh with headless Chrome.
     ?layout=device&shot=<png>&title=<headline>&sub=<line>&w=<px>&h=<px>
     ?layout=text&title=<headline>&points=<a|b|c>&foot=<line>&icon=<png>&w=<px>&h=<px>
     Flat Evergreen field, upright serif headline, system sans for small text. No prices, no gradients, no glow. -->
<style>
  html, body { margin: 0; }
  body {
    --u: calc(var(--w) / 100);
    width: var(--w); height: var(--h); overflow: hidden; position: relative;
    background: #1f5a46; color: #fff; font-family: -apple-system, system-ui, sans-serif;
  }
  .caption { position: absolute; left: calc(var(--u) * 8); right: calc(var(--u) * 8); top: calc(var(--h) * 0.052); }
  h1 {
    font-family: ui-serif, "New York", Georgia, serif; font-weight: 700; font-style: normal;
    font-size: calc(var(--u) * 9.4); line-height: 1.04; letter-spacing: -0.01em; margin: 0;
  }
  .sub { font-size: calc(var(--u) * 4.1); line-height: 1.3; margin: calc(var(--u) * 2.6) 0 0; color: rgba(255,255,255,.84); }

  /* iPhone: titanium rim, black bezel, screen, Dynamic Island, side buttons. Bleeds off the bottom edge. */
  .phone {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(var(--h) * 0.228); width: calc(var(--u) * 74);
    border-radius: calc(var(--u) * 12.6); padding: calc(var(--u) * 1.15);
    background: linear-gradient(#3b4440, #262c29);
    box-shadow: 0 calc(var(--u) * 0.4) calc(var(--u) * 0.8) rgba(0,0,0,.28);
  }
  .bezel { border-radius: calc(var(--u) * 11.5); padding: calc(var(--u) * 1.7); background: #050706; position: relative; }
  .screen { display: block; width: 100%; border-radius: calc(var(--u) * 9.9); }
  .island {
    position: absolute; top: calc(var(--u) * 3.3); left: 50%; transform: translateX(-50%);
    width: calc(var(--u) * 21); height: calc(var(--u) * 6.1); border-radius: calc(var(--u) * 3.1); background: #000;
  }
  .btn { position: absolute; width: calc(var(--u) * 0.9); background: #2b3230; border-radius: calc(var(--u) * 0.4); }
  .btn.a { left: calc(var(--u) * -0.7); top: calc(var(--u) * 23); height: calc(var(--u) * 7); }
  .btn.b { left: calc(var(--u) * -0.7); top: calc(var(--u) * 33); height: calc(var(--u) * 12); }
  .btn.c { left: calc(var(--u) * -0.7); top: calc(var(--u) * 47); height: calc(var(--u) * 12); }
  .btn.d { right: calc(var(--u) * -0.7); top: calc(var(--u) * 38); height: calc(var(--u) * 18); }

  /* Text-only panel */
  .panel { position: absolute; left: calc(var(--u) * 8); right: calc(var(--u) * 8); top: calc(var(--h) * 0.2); }
  .panel img { width: calc(var(--u) * 22); height: calc(var(--u) * 22); border-radius: calc(var(--u) * 5); display: block; margin-bottom: calc(var(--u) * 9); }
  .panel h1 { font-size: calc(var(--u) * 11); }
  .panel ul { list-style: none; padding: 0; margin: calc(var(--u) * 10) 0 0; }
  .panel li {
    font-size: calc(var(--u) * 5.6); font-weight: 600; padding: calc(var(--u) * 3.6) 0;
    border-top: calc(var(--u) * 0.25) solid rgba(255,255,255,.22); display: flex; align-items: center; gap: calc(var(--u) * 4);
  }
  .panel li svg { width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); flex: none; }
  .foot { position: absolute; left: calc(var(--u) * 8); right: calc(var(--u) * 8); bottom: calc(var(--h) * 0.07); font-size: calc(var(--u) * 4); color: rgba(255,255,255,.8); }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  document.body.style.setProperty("--w", q.get("w") + "px");
  document.body.style.setProperty("--h", q.get("h") + "px");
  const esc = (s) => (s || "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  const title = esc(q.get("title")).replace(/\\n/g, "<br>");
  if (q.get("layout") === "text") {
    const check = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#A84B24"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const points = (q.get("points") || "").split("|").filter(Boolean).map((p) => `<li>${check}${esc(p)}</li>`).join("");
    document.body.innerHTML = `<div class="panel"><img src="${esc(q.get("icon"))}" alt=""><h1>${title}</h1><ul>${points}</ul></div><p class="foot">${esc(q.get("foot"))}</p>`;
  } else {
    document.body.innerHTML = `<div class="caption"><h1>${title}</h1><p class="sub">${esc(q.get("sub"))}</p></div>
      <div class="phone"><span class="btn a"></span><span class="btn b"></span><span class="btn c"></span><span class="btn d"></span>
      <div class="bezel"><img class="screen" src="${esc(q.get("shot"))}" alt=""><div class="island"></div></div></div>`;
  }
</script>
</body>
</html>
